# Database configuration for development environment

database:
  primary:
    host: localhost
    port: 5432
    name: myapp_development
    user: dev_user
    pool:
      min: 2
      max: 10
      idle_timeout: 300s

  read_replica:
    enabled: false

  migrations:
    auto_run: true
    path: /migrations

  backup:
    enabled: false

monitoring:
  slow_query_threshold: 100ms
  log_queries: true
